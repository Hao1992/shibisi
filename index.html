const PR={"1-1": ["6-5s", ["ts", "ccz"], 0, "招牌黄焖鸡，配一碟酸辣的辣白菜解腻，再来一瓶冰啤酒或一罐零度可乐。", "Nuestro plato estrella con un poco de kimchi para equilibrar, y una cerveza fría o una Coca-Cola Zero.", "Our signature pot with a little kimchi to cut the richness, plus a cold beer or a Coke Zero."], "1-2": ["6-5s", ["am", "ccz"], 0, "蘑菇鸡咸鲜下饭，配一碟辣白菜开胃，再来一瓶冰饮。", "El pollo con champiñones pide un poco de kimchi y algo fresquito.", "Mushroom chicken calls for a little kimchi and something cold."], "1-3": ["6-4", ["hk", "cc"], 0, "软嫩的五花肉配一碟清爽的凉拌海藻，一浓一清，再加一瓶冰饮。", "La panceta, con un alga fresca para equilibrar y una bebida fría.", "Pork belly with a fresh seaweed salad for balance and a cold drink."], "1-4": ["6-5s", ["ts", "ccz"], 0, "慢慢啃排骨，配一碟辣白菜解腻，再来一瓶冰啤酒或零度可乐。", "Costillas sin prisa, kimchi para equilibrar y una cerveza o Coca-Cola Zero.", "Ribs to take your time over, kimchi for balance, and a beer or Coke Zero."], "1-5": ["6-4", ["hk", "ccz"], 0, "焖牛肉味道厚，配一碟清爽的凉拌海藻，再加一瓶冰饮。", "La ternera es intensa: un alga fresca y una bebida fría la acompañan bien.", "Rich beef pairs well with fresh seaweed and a cold drink."], "1-6": ["6-4", ["ag", "ne"], 0, "蔬菜锅配一碟清爽的凉拌海藻，饮料来一瓶 Águila 或冰红茶。", "La olla de verduras con un alga fresca y una Águila o un Nestea.", "The vegetable pot with fresh seaweed and an Águila or a Nestea."], "2-1": ["6-1", ["am", "aq"], 1, "清汤面已经有汤了，不如加一份有嚼劲的五香牛肉，让这一餐更丰富。", "Ya tienes caldo: añade ternera a las cinco especias para una comida más completa.", "You've already got broth, so add five-spice beef for a fuller meal."], "2-2": ["6-4", ["hk", "ne"], 1, "温和的鸡丝汤面，配一碟清爽的凉拌海藻，一热一凉刚刚好。", "Un cuenco suave con un alga fresca: caliente y frío, perfecto.", "A gentle bowl with cold seaweed: hot and cold, just right."], "2-3": ["6-5s", ["ts", "ccz"], 1, "红烧牛肉汤浓味厚，配一小碟酸辣的辣白菜，解腻又开胃。", "Caldo intenso y un poco de kimchi para refrescar.", "A rich broth with a little kimchi to freshen things up."], "2-4": ["6-2", ["rd", "wl"], 0, "麻辣汤面一定要备好「灭火器」：一碟凉拌黄瓜降温，再来一瓶冰的柠檬啤酒或王老吉。", "Con el mala hay que tener extintor: pepino fresco y una Radler fría o un Wanglaoji.", "Mala needs a fire extinguisher: cool cucumber plus a cold Radler or Wanglaoji."], "2-5": ["6-1", ["ag", "aq"], 1, "酸菜面酸爽开胃，加一份五香牛肉，肉量直接翻倍。", "Añade ternera a las cinco especias y tendrás el doble de carne.", "Add five-spice beef and you double the meat."], "2-6": ["6-5s", ["am", "cc"], 1, "排骨汤面配一小碟辣白菜，酸辣开胃。", "Costillas con un poco de kimchi para abrir el apetito.", "Ribs with a little kimchi to wake up the palate."], "2-7": ["6-4", ["ts", "cc"], 0, "麻辣汤面吃着会越来越热，来一瓶冰啤酒或一罐冰可乐，再配一碟清爽的海藻。", "El mala calienta cada vez más: cerveza o Coca-Cola bien fría y un alga fresca.", "Mala gets hotter as you go: an ice-cold beer or Coke and fresh seaweed."], "2-8": ["6-4", ["hk", "fa"], 1, "酸甜的西红柿鸡蛋面，配一碟清爽的凉拌海藻，适合不吃辣的朋友。", "Tomate y huevo con un alga fresca: ideal sin picante.", "Tomato and egg with fresh seaweed: perfect without spice."], "2-9": ["6-5s", ["am", "gt"], 1, "清淡的蔬菜面，加一小碟辣白菜，味道一下子就丰富了。", "Un poco de kimchi y estos fideos suaves ganan mucho sabor.", "A little kimchi gives this mild bowl a lift."], "3-1": ["6-5s", ["ag", "fa"], 0, "带锅气的鸡蛋炒面，配一碟辣白菜，再来一瓶冰饮。", "Fideos al wok con kimchi y una bebida fría.", "Wok-fried noodles with kimchi and a cold drink."], "3-2": ["6-4", ["am", "ccz"], 0, "炒面配冰啤酒或可乐，是不会出错的组合，再加一碟清爽的海藻。", "Fideos salteados y cerveza o Coca-Cola: no falla. Y un alga fresca.", "Fried noodles with beer or Coke never fails. Add fresh seaweed."], "3-3": ["6-1", ["hk", "ne"], 0, "香菇鸡丝炒面配一份五香牛肉，一个人也能吃出小馆子的感觉。", "Con ternera a las cinco especias, comes como en un restaurante de barrio en China.", "With five-spice beef, it's a proper Chinese neighbourhood meal, even for one."], "3-4": ["6-2", ["ts", "ccz"], 0, "香辣炒面配一瓶冰青岛或零度可乐，再来凉拌黄瓜降降温。", "Picante: Tsingtao o Coca-Cola Zero bien fría y pepino para refrescar.", "Spicy: an ice-cold Tsingtao or Coke Zero and cucumber to cool down."], "3-5": ["6-4", ["rd", "wl"], 0, "麻辣牛肉炒面很够味，配清爽的海藻，饮料来一瓶柠檬啤酒或王老吉。", "Mucho sabor mala: alga fresca y una Radler o un Wanglaoji.", "Big mala flavour: fresh seaweed and a Radler or Wanglaoji."], "4-1": ["6-4", ["am", "cc"], 0, "番茄鸡蛋炒方便面是街头小吃的味道，配一罐冰可乐或一瓶 Amstel，再加一碟清爽的海藻。", "Sabor de puesto callejero: Coca-Cola o Amstel bien fría y un alga fresca.", "Street-food flavour: an ice-cold Coke or Amstel and fresh seaweed."], "4-2": ["6-5s", ["ag", "ccz"], 0, "香辣方便面配一瓶冰 Águila 或零度可乐，再加一小碟辣白菜。", "Con una Águila o Coca-Cola Zero fría y un poco de kimchi.", "With a cold Águila or Coke Zero and a little kimchi."], "4-3": ["6-1", ["ts", "cc"], 0, "孜然是夜市烤串的味道，夜市当然要配一瓶冰饮和一份五香牛肉。", "El comino sabe a mercado nocturno, y eso pide una bebida fría y ternera a las cinco especias.", "Cumin tastes of night markets, which call for a cold drink and five-spice beef."], "4-4": ["6-4", ["hk", "wl"], 0, "麻辣方便面配一瓶冰喜力或王老吉，再加清爽的海藻。", "Mala con Heineken fría o Wanglaoji y un alga fresca.", "Mala with a cold Heineken or Wanglaoji and fresh seaweed."], "5-1": ["6-5s", ["am", "gt"], 0, "香菇鸡丝拌面酱香浓，配一小碟辣白菜开胃。", "Fideos con salsa intensa y un poco de kimchi para abrir el apetito.", "Rich sauced noodles with a little kimchi."], "5-2": ["6-4", ["ag", "ccz"], 0, "香辣拌面配一瓶冰 Águila 或零度可乐，再加清爽的海藻。", "Picante con Águila o Coca-Cola Zero fría y un alga fresca.", "Spicy, with a cold Águila or Coke Zero and fresh seaweed."], "5-3": ["6-1", ["hk", "aq"], 0, "酸菜牛肉拌面配一份五香牛肉，酸香里再加一份肉香。", "Más carne: ternera a las cinco especias junto a lo ácido de la mostaza encurtida.", "More meat: five-spice beef alongside the tangy pickles."], "5-4": ["6-5s", ["ts", "gt"], 0, "炸酱面酱香浓，配一小碟辣白菜开胃。", "Salsa intensa con un poco de kimchi para abrir el apetito.", "Rich sauce with a little kimchi to wake up the palate."], "5-5": ["6-2", ["rd", "ne"], 0, "油泼面香辣，配凉拌黄瓜降温，饮料来一瓶柠檬啤酒或冰红茶。全素搭配。", "Aceite de chile, pepino para refrescar y una Radler o un Nestea. Combinación vegana.", "Chilli oil, cool cucumber and a Radler or Nestea. A vegan combo."], "7-1": ["6-1", ["am", "cc"], 0, "酱油炒饭配一份五香牛肉，再来一瓶冰 Amstel 或可乐，简单的快乐。", "Arroz frito, ternera a las cinco especias y una Amstel o Coca-Cola fría: felicidad sencilla.", "Fried rice, five-spice beef and a cold Amstel or Coke: simple happiness."]};
const DET={"1-1": {"zh": {"what": "黄焖鸡米饭源自山东济南，是中国北方最常见的家常快餐之一。鸡块先炒香，再加入酱油和香菇汁慢火焖煮，最后在砂锅里煮开，冒着热气上桌。", "story": "相传黄焖鸡出自上世纪济南的一家老馆子，因为出锅快、下饭、实惠，后来从山东一路火遍了中国的大街小巷。到了瓦伦西亚，我们还是一锅一锅地焖，用砂锅端到你面前。", "ing": "鸡肉、土豆、香菇汁、油菜，配米饭", "taste": "咸鲜，酱香浓郁。土豆焖得软糯，吸饱了汤汁。", "who": "第一次来的客人、不吃辣的客人、想吃一顿热乎下饭菜的人。", "adj": 1, "how": "POT"}, "es": {"what": "El Huangmenji es uno de los platos caseros más populares del norte de China, originario de Jinan (Shandong). El pollo se sofríe y luego se guisa a fuego lento con salsa de soja y caldo de setas shiitake, y se sirve hirviendo en olla de barro.", "story": "Cuenta la historia que nació en un viejo restaurante de Jinan. Era rápido, sabroso y barato, y acabó llegando a todas las calles de China. En Valencia lo seguimos haciendo olla a olla y te lo servimos en barro.", "ing": "Pollo, patata, caldo de setas shiitake, pak choi y arroz", "taste": "Salado y sabroso, con mucho sabor a soja. La patata queda tierna y empapada de salsa.", "who": "Tu primera visita, si no quieres picante o si buscas un plato caliente y reconfortante.", "adj": 1, "how": "POT"}, "en": {"what": "Huangmenji is one of the most popular home-style dishes in northern China, from Jinan in Shandong. The chicken is seared, then slow-braised in soy sauce and shiitake stock, and served bubbling in a clay pot.", "story": "The story goes that it started in an old restaurant in Jinan. Quick, filling and cheap, it spread to every street in China. In Valencia we still cook it pot by pot and bring it to you in clay.", "ing": "Chicken, potato, shiitake stock, pak choi, with rice", "taste": "Savoury with a deep soy flavour. The potato turns soft and soaks up the sauce.", "who": "First-timers, anyone avoiding spice, or anyone who wants a hot, comforting meal.", "adj": 1, "how": "POT"}}, "1-2": {"zh": {"what": "黄焖鸡家族里的「蘑菇版」。把土豆换成蘑菇，和鸡肉一起在同一锅酱汁里慢慢焖。蘑菇在焖的过程中会吐出自己的鲜味，又把酱汁吸回去，所以这一锅的汤汁比土豆版更鲜。", "story": "在中国，鸡和蘑菇是一对老搭档，东北有道名菜叫「小鸡炖蘑菇」，几乎每个北方人都吃过。我们把这对搭档放进了黄焖的砂锅里。", "ing": "鸡肉、白蘑菇、油菜，配米饭", "taste": "咸鲜酱香，菌菇香气浓。蘑菇嫩滑多汁，咬下去会爆出汤汁。", "who": "喜欢菌菇味道、想要汤汁更鲜一点的客人。", "adj": 1, "how": "POT"}, "es": {"what": "La versión con champiñones del Huangmenji. Cambiamos la patata por champiñones y los guisamos con el pollo en la misma salsa. Las setas sueltan su jugo y vuelven a absorber la salsa, así que esta olla sale todavía más sabrosa.", "story": "En China el pollo y las setas son una pareja clásica: en el noreste hay un plato famoso, el pollo guisado con setas, que casi todo el mundo ha probado. Nosotros los juntamos en la olla de barro.", "ing": "Pollo, champiñones, pak choi y arroz", "taste": "Salado y sabroso, con mucho aroma a setas. Los champiñones quedan tiernos y jugosos.", "who": "Amantes de las setas y quien quiere una salsa más intensa.", "adj": 1, "how": "POT"}, "en": {"what": "The mushroom version of Huangmenji. We swap the potato for button mushrooms and braise them with the chicken in the same sauce. The mushrooms release their juices and soak the sauce back up, so this pot is even richer.", "story": "In China, chicken and mushrooms are an old pairing: the northeast has a famous dish of chicken stewed with mushrooms that almost everyone has eaten. We put the pair in our clay pot.", "ing": "Chicken, button mushrooms, pak choi, with rice", "taste": "Savoury, with a strong mushroom aroma. The mushrooms are tender and juicy.", "who": "Mushroom lovers and anyone who likes a richer sauce.", "adj": 1, "how": "POT"}}, "1-3": {"zh": {"what": "用五花肉做的黄焖锅。五花肉是肥瘦相间的猪腩肉，在酱汁里慢慢焖到软嫩入味，肥的部分化进酱汁里，吃起来一点也不腻。配上土豆和金针菇（一种细长的白色菌菇，西班牙常叫 enoki）。", "story": "在中国，单说一个「肉」字，指的往往就是猪肉，而五花肉是中国人最爱的那一块，红烧肉、回锅肉都用它。这一锅也是我们自家人最爱的一锅。", "ing": "五花肉、土豆、金针菇、油菜，配米饭", "taste": "咸鲜酱香。五花肉软嫩入味，不油不腻；金针菇爽滑，土豆软糯。", "who": "喜欢猪肉、想吃一锅香浓下饭菜的客人。", "adj": 1, "how": "POT"}, "es": {"what": "Huangmen con panceta de cerdo. La panceta, con capas de carne y grasa, se guisa despacio hasta quedar tiernísima; la grasa se funde en la salsa y no resulta nada pesada. Con patata y setas enoki (unas setas blancas, largas y finas).", "story": "En China, cuando se dice simplemente «carne», casi siempre es cerdo, y la panceta es el corte favorito: con ella se hacen clásicos como el hongshao rou, panceta guisada en soja. Esta olla es también la favorita de nuestra familia.", "ing": "Panceta de cerdo, patata, setas enoki, pak choi y arroz", "taste": "Salado y sabroso. La panceta se deshace en la boca, sin sensación grasienta. Las enoki son suaves y la patata, tierna.", "who": "Amantes del cerdo y de los guisos con mucho sabor.", "adj": 1, "how": "POT"}, "en": {"what": "Huangmen pot with pork belly. Layered with meat and fat, the belly is braised slowly until meltingly tender; the fat melts into the sauce, so it never feels greasy. With potato and enoki (long, thin white mushrooms).", "story": "In China, the word for meat on its own usually means pork, and belly is the favourite cut, used in classics like red-braised pork. This pot is also our family's favourite.", "ing": "Pork belly, potato, enoki mushrooms, pak choi, with rice", "taste": "Savoury. The pork belly is melt-in-the-mouth and not greasy; the enoki are silky and the potato soft.", "who": "Pork lovers and anyone after a rich, comforting stew.", "adj": 1, "how": "POT"}}, "1-4": {"zh": {"what": "用排骨做的黄焖锅。排骨在酱汁里焖到入味，配土豆和金针菇。黄焖系列里最适合「慢慢啃」的一锅。", "story": "在中国家庭里，排骨是过节和招待客人时才舍得多做的菜，啃排骨也被很多人认为是吃饭最快乐的部分。", "ing": "排骨、土豆、金针菇、油菜，配米饭", "taste": "咸鲜酱香，排骨入味，骨头边上的肉最香。", "note": "排骨带骨头，吃的时候请留意。", "who": "喜欢啃排骨、不赶时间的客人。", "adj": 1, "how": "POT"}, "es": {"what": "Huangmen con costillas de cerdo, guisadas hasta coger todo el sabor de la salsa. Con patata y setas enoki. Es la olla para comer sin prisa.", "story": "En las familias chinas, las costillas se cocinaban en días de fiesta o con invitados, y para muchos roer el hueso es la mejor parte de la comida.", "ing": "Costillas de cerdo, patata, setas enoki, pak choi y arroz", "taste": "Salado y sabroso; la carne pegada al hueso es la más rica.", "note": "Las costillas llevan hueso.", "who": "Quien disfruta de las costillas y no tiene prisa.", "adj": 1, "how": "POT"}, "en": {"what": "Huangmen pot with pork ribs, braised until they soak up the sauce. With potato and enoki. The pot to eat slowly.", "story": "In Chinese homes, ribs were for holidays and guests, and for many people gnawing the bone is the best part of the meal.", "ing": "Pork ribs, potato, enoki mushrooms, pak choi, with rice", "taste": "Savoury; the meat closest to the bone is the tastiest.", "note": "Ribs contain bones.", "who": "Rib lovers with time to enjoy them.", "adj": 1, "how": "POT"}}, "1-5": {"zh": {"what": "用牛肉做的黄焖锅，是黄焖系列里分量感最足、味道最厚的一款。牛肉经过慢火焖煮，配土豆和金针菇。", "story": "在中国北方，冬天最受欢迎的就是这样一锅热乎乎、能配一大碗米饭的焖牛肉。", "ing": "牛肉、土豆、金针菇、油菜，配米饭", "taste": "咸鲜酱香，牛肉软烂入味，酱汁比鸡肉版更醇厚。", "who": "胃口好、喜欢牛肉的客人。", "adj": 1, "how": "POT"}, "es": {"what": "Huangmen con ternera: la olla más contundente y de sabor más profundo. La ternera se guisa a fuego lento con patata y setas enoki.", "story": "En el norte de China, en invierno, no hay nada más deseado que una olla de ternera guisada con un buen cuenco de arroz.", "ing": "Ternera, patata, setas enoki, pak choi y arroz", "taste": "Salado y sabroso; la ternera queda tierna y la salsa, más intensa que la de pollo.", "who": "Buen apetito y amantes de la ternera.", "adj": 1, "how": "POT"}, "en": {"what": "Huangmen pot with beef: the heartiest, deepest-flavoured pot. The beef is slow-braised with potato and enoki.", "story": "In northern China, nothing beats a steaming pot of braised beef and a big bowl of rice in winter.", "ing": "Beef, potato, enoki mushrooms, pak choi, with rice", "taste": "Savoury; the beef is tender and the sauce richer than the chicken version.", "who": "Big appetites and beef lovers.", "adj": 1, "how": "POT"}}, "1-6": {"zh": {"what": "不放肉块的黄焖锅。土豆、白蘑菇、金针菇和油菜，在和其他黄焖锅同样的酱汁里焖煮。三种口感：软糯的土豆、嫩滑的蘑菇、有嚼劲的金针菇。", "story": "很多人以为黄焖锅的灵魂是肉，其实是那一锅酱汁。少了肉块，反而更能吃出酱汁本身的味道，也是想多吃蔬菜时的好选择。", "ing": "土豆、白蘑菇、金针菇、油菜，配米饭；汤底为肉汤", "taste": "咸鲜酱香，菌菇的鲜味很足。", "note": "这道菜不含肉块，但汤底是肉汤，不适合素食和纯素客人。", "who": "想多吃蔬菜、吃得清爽一点的客人。", "adj": 1, "how": "POT"}, "es": {"what": "Huangmen sin trozos de carne: patata, champiñones, setas enoki y pak choi guisados en la misma salsa que las demás ollas. Tres texturas: patata tierna, champiñón jugoso y enoki con un punto firme.", "story": "Mucha gente piensa que el alma del Huangmen es la carne, pero en realidad es la salsa. Sin trozos de carne se aprecia todavía mejor, y es perfecta si te apetece comer más verdura.", "ing": "Patata, champiñones, setas enoki, pak choi y arroz. Caldo de carne.", "taste": "Salado y sabroso, con mucho sabor a setas.", "note": "No lleva trozos de carne, pero el caldo es de carne: no es apto para vegetarianos ni veganos.", "who": "Quien quiere comer más verdura.", "adj": 1, "how": "POT"}, "en": {"what": "Huangmen without pieces of meat: potato, button mushrooms, enoki and pak choi braised in the same sauce as the other pots. Three textures: soft potato, juicy mushroom and springy enoki.", "story": "Many think the soul of a Huangmen pot is the meat, but really it is the sauce. Without the meat you taste it even better, and it is a good choice when you want more vegetables.", "ing": "Potato, button mushrooms, enoki, pak choi, with rice. Meat-based broth.", "taste": "Savoury, full of mushroom flavour.", "note": "No pieces of meat, but the broth is meat-based: not suitable for vegetarians or vegans.", "who": "Anyone who wants more vegetables.", "adj": 1, "how": "POT"}}, "2-1": {"zh": {"what": "清汤牛肉面：清澈的汤、牛肉、半个水煮蛋、青菜和店里手工做的小麦面。没有浓重的酱色，吃的就是汤的鲜和面的筋道。", "story": "说起清汤牛肉面，很多中国人第一个想到的是兰州。在那里，一碗好牛肉面的标准是「汤要清」，清到能看见碗底。", "ing": "手工小麦面（店内制作）、牛肉、半个水煮蛋、青菜", "taste": "汤清味鲜，不油不腻，面条筋道。", "who": "口味清淡、想吃一碗舒服热汤面的客人。"}, "es": {"what": "Ramen chino con caldo claro de ternera: caldo limpio, ternera, medio huevo cocido, verdura y fideos de trigo hechos a mano en el local. Sin salsas oscuras: aquí mandan el caldo y la textura del fideo.", "story": "En China, el caldo claro de ternera se asocia con la ciudad de Lanzhou, donde un buen cuenco se juzga por la claridad del caldo: tiene que verse el fondo.", "ing": "Fideos de trigo hechos a mano en el local, ternera, medio huevo cocido, verdura", "taste": "Caldo ligero y sabroso, nada graso; fideos firmes.", "who": "Quien prefiere sabores suaves y un cuenco reconfortante."}, "en": {"what": "Chinese noodle soup in a clear beef broth: clean broth, beef, half a boiled egg, greens and wheat noodles handmade in-house. No heavy sauce: it is all about the broth and the bite of the noodles.", "story": "In China, clear beef noodle soup is linked to the city of Lanzhou, where a good bowl is judged by its broth: clear enough to see the bottom.", "ing": "Handmade wheat noodles (made in-house), beef, half a boiled egg, greens", "taste": "Light, savoury broth, not oily; springy noodles.", "who": "Anyone who likes mild flavours and a comforting bowl."}}, "2-2": {"zh": {"what": "鸡丝、香菇配店里手工做的面，再加一个鸡蛋。香菇在中文里的意思就是「香的蘑菇」，它的香气是这碗面的主角。", "story": "在中国，一碗鸡丝面常常是家里人做给病人、孩子或者晚归的人吃的。它不追求刺激，追求的是暖。", "ing": "手工小麦面（店内制作）、鸡丝、香菇、鸡蛋、青菜", "taste": "咸鲜温和，香菇香气明显，鸡丝细嫩。", "who": "不吃辣、第一次尝试中式汤面的客人，也适合小朋友。"}, "es": {"what": "Pollo desmenuzado y setas shiitake con fideos hechos a mano en el local y un huevo cocido. En chino, el shiitake se llama xianggu, «seta aromática», y su aroma es el protagonista.", "story": "En China, un cuenco de fideos con pollo es lo que se prepara en casa para alguien enfermo, para los niños o para quien llega tarde. No busca emociones fuertes: busca reconfortar.", "ing": "Fideos de trigo hechos a mano en el local, pollo, setas shiitake, huevo, verdura", "taste": "Suave y sabroso, con aroma a shiitake; pollo tierno.", "who": "Quien no quiere picante, quien prueba fideos chinos por primera vez, y los niños."}, "en": {"what": "Shredded chicken and shiitake with noodles handmade in-house and a boiled egg. In Chinese, shiitake is xianggu, the fragrant mushroom, and its aroma leads this bowl.", "story": "In China, chicken noodle soup is what families make for someone who is ill, for children or for whoever gets home late. It is not about excitement; it is about warmth.", "ing": "Handmade wheat noodles (made in-house), chicken, shiitake, egg, greens", "taste": "Mild and savoury, with shiitake aroma; tender chicken.", "who": "No-spice eaters, first-timers with Chinese noodles, and kids."}}, "2-3": {"zh": {"what": "红烧牛肉面。「红烧」是中国菜里一种用酱油慢慢烧的做法，烧出来的颜色是红褐色，所以叫红烧。牛肉烧得软烂，连汤都是深色的。", "story": "红烧牛肉面在中国几乎人人都吃过：中国最畅销的方便面口味之一，就叫「红烧牛肉面」。这是很多中国人从小吃到大的味道。", "ing": "手工小麦面（店内制作）、红烧牛肉、青菜", "taste": "酱香浓郁，汤色深、味道厚，牛肉软烂入味。", "who": "喜欢浓郁口味、想吃「最中国」的一碗牛肉面的客人。"}, "es": {"what": "Ramen de ternera al estilo hongshao, «estofado rojo»: la carne se cuece lentamente con salsa de soja hasta tomar un color rojizo oscuro. La ternera queda tierna y el caldo, oscuro e intenso.", "story": "Casi todos los chinos lo han comido: uno de los sabores de fideos instantáneos más vendidos de China lleva justo este nombre. Es un sabor de infancia para muchos.", "ing": "Fideos de trigo hechos a mano en el local, ternera estofada, verdura", "taste": "Intenso, con mucho sabor a soja; ternera muy tierna.", "who": "Quien busca sabores intensos y el cuenco de ternera más chino."}, "en": {"what": "Red-braised beef noodle soup. Red-braising (hongshao) is a Chinese method of slowly cooking meat in soy sauce until it turns reddish-brown. The beef is tender and the broth dark and rich.", "story": "Almost everyone in China has eaten it: one of the country's best-selling instant noodle flavours is named after this dish. A taste many grew up with.", "ing": "Handmade wheat noodles (made in-house), red-braised beef, greens", "taste": "Rich and soy-forward; dark broth, very tender beef.", "who": "Fans of bold flavours who want the most Chinese of beef noodle bowls."}}, "2-4": {"zh": {"what": "麻辣汤底，配猪肉丝和店里手工做的面。「麻辣」是四川风味的代表：「辣」来自辣椒，「麻」来自花椒，会让嘴唇有一种轻微发麻、像电流一样的感觉。", "story": "第一次吃花椒的外国客人常常会吓一跳，以为自己过敏了。其实那种麻麻的感觉正是它的魅力，很多人吃过一次就上瘾了。", "ing": "手工小麦面（店内制作）、猪肉丝、麻辣酱、芝麻、香菜、青菜", "taste": "又麻又辣，越吃越香。", "note": "这是一道辣菜，花椒的麻感明显。碗里有香菜，不要香菜请提前跟店员说。", "who": "爱吃辣、想体验真正四川「麻」味的客人。"}, "es": {"what": "Caldo picante mala con tiras de cerdo y fideos hechos a mano en el local. El mala es el sabor de Sichuan: «la» es el picante del chile y «ma» el hormigueo de la pimienta de Sichuan, que deja los labios ligeramente dormidos, como una pequeña corriente.", "story": "Mucha gente se asusta la primera vez y cree que tiene alergia. Ese cosquilleo es justamente la gracia, y mucha gente se engancha.", "ing": "Fideos de trigo hechos a mano en el local, cerdo, salsa picante mala, sésamo, cilantro, verdura", "taste": "Picante y con hormigueo; cuanto más comes, más te gusta.", "note": "Plato picante, con hormigueo intenso. Lleva cilantro: avísanos si no lo quieres.", "who": "Amantes del picante que quieren probar el auténtico «ma» de Sichuan."}, "en": {"what": "Mala broth with pork strips and noodles handmade in-house. Mala is the signature taste of Sichuan: la is the chilli heat, ma is the tingle of Sichuan pepper, which makes your lips slightly numb, like a small electric buzz.", "story": "Many first-timers get a fright and think they're having an allergic reaction. That tingle is exactly the point, and plenty of people get hooked.", "ing": "Handmade wheat noodles (made in-house), pork, mala chilli sauce, sesame, coriander, greens", "taste": "Hot and tingly; it gets better with every bite.", "note": "Spicy, with a strong numbing tingle. Topped with coriander: let us know if you'd rather skip it.", "who": "Spice lovers who want real Sichuan ma."}}, "2-5": {"zh": {"what": "「老坛酸菜」是用坛子腌出来的酸菜，在中国几乎家喻户晓。配上炖好的牛肉和店里手工做的面，浇上热汤。", "story": "在中国，几乎每个人都能说出自己记忆里那一口酸菜面的味道。酸菜、牛肉配上手工做的小麦面，是一碗简单又暖胃的家常面。", "ing": "手工小麦面（店内制作）、炖牛肉、酸菜、青菜", "taste": "汤底酸爽开胃，咸鲜里带着酸菜的发酵香，牛肉炖得软烂。", "note": "酸味比较明显，不习惯酸口的客人可以先尝一口汤。", "who": "喜欢酸口、想吃得清爽开胃的客人。"}, "es": {"what": "El laotan suancai es mostaza china encurtida en tinaja, un sabor que conoce todo el mundo en China. Con ternera estofada, fideos hechos a mano en el local y caldo caliente.", "story": "En China casi todo el mundo recuerda su cuenco de fideos con mostaza encurtida. Encurtido, ternera y fideos de trigo hechos a mano: sencillo y reconfortante.", "ing": "Fideos de trigo hechos a mano en el local, ternera estofada, mostaza china encurtida, verdura", "taste": "Caldo ácido y refrescante, con el aroma fermentado del encurtido; ternera muy tierna.", "note": "El toque ácido es marcado; si no estás acostumbrado, prueba primero el caldo.", "who": "Amantes de los sabores ácidos."}, "en": {"what": "Laotan suancai is mustard greens pickled in a clay jar, a taste every Chinese person knows. With braised beef, noodles handmade in-house and hot broth.", "story": "Almost everyone in China remembers their bowl of pickled-greens noodles. Pickles, beef and handmade wheat noodles: simple and warming.", "ing": "Handmade wheat noodles (made in-house), braised beef, pickled mustard greens, leafy greens", "taste": "Tangy, refreshing broth with a fermented aroma; very tender beef.", "note": "Noticeably sour; if you're not used to it, taste the broth first.", "who": "Fans of sour flavours."}}, "2-6": {"zh": {"what": "排骨汤面。排骨炖得入味，配上店里手工做的面和热汤。一碗里既有面又有「肉可以啃」，是很扎实的一顿饭。", "story": "在中国北方，排骨面是很多面馆的招牌：先吃一口面，再啃一块排骨，是最朴实的满足感。", "ing": "手工小麦面（店内制作）、排骨、青菜", "taste": "咸鲜，排骨入味，汤里带着肉香。", "note": "排骨带骨头，吃的时候请留意。", "who": "喜欢排骨、想吃得扎实的客人。"}, "es": {"what": "Ramen con costillas de cerdo guisadas, fideos hechos a mano en el local y caldo caliente. Fideos y costilla en el mismo cuenco: una comida completa.", "story": "En el norte de China, los fideos con costilla son la especialidad de muchas casas de fideos: un bocado de fideos, un bocado de costilla.", "ing": "Fideos de trigo hechos a mano en el local, costillas de cerdo, verdura", "taste": "Sabroso; costillas con mucho sabor y caldo con aroma a carne.", "note": "Las costillas llevan hueso.", "who": "Amantes de las costillas y de las comidas contundentes."}, "en": {"what": "Noodle soup with braised pork ribs, noodles handmade in-house and hot broth. Noodles and ribs in one bowl: a proper meal.", "story": "In northern China, rib noodles are the signature of many noodle shops: a mouthful of noodles, then a bite of rib.", "ing": "Handmade wheat noodles (made in-house), pork ribs, greens", "taste": "Savoury; flavourful ribs and a meaty broth.", "note": "Ribs contain bones.", "who": "Rib lovers and big appetites."}}, "2-7": {"zh": {"what": "不放肉的麻辣汤面，加一个鸡蛋。麻辣汤底的辣来自辣椒，麻来自花椒。", "story": "在四川和重庆，一碗简单的麻辣面就是很多人的早餐。没有肉也不要紧，麻辣汤底就是这碗面的全部灵魂。", "ing": "手工小麦面（店内制作）、麻辣酱、鸡蛋、青菜", "taste": "麻辣过瘾，花椒的麻感明显。", "note": "这是一道辣菜。", "who": "爱吃辣的素食客人（含鸡蛋）。"}, "es": {"what": "Ramen picante mala sin carne, con huevo. El picante viene del chile y el hormigueo, de la pimienta de Sichuan.", "story": "En Sichuan y Chongqing, un cuenco sencillo de fideos mala es el desayuno de mucha gente. No necesita carne: el caldo es su alma.", "ing": "Fideos de trigo hechos a mano en el local, salsa picante mala, huevo, verdura", "taste": "Picante y con hormigueo intenso.", "note": "Plato picante.", "who": "Vegetarianos amantes del picante (lleva huevo)."}, "en": {"what": "Meat-free mala noodle soup with egg. The heat comes from chilli, the tingle from Sichuan pepper.", "story": "In Sichuan and Chongqing, a simple bowl of mala noodles is breakfast for many. No meat needed: the broth is its soul.", "ing": "Handmade wheat noodles (made in-house), mala chilli sauce, egg, greens", "taste": "Hot with a strong tingle.", "note": "Spicy dish.", "who": "Vegetarian spice lovers (contains egg)."}}, "2-8": {"zh": {"what": "西红柿炒鸡蛋大概是中国人最熟悉的家常菜，几乎每个人都会做。我们把它做成了汤面：西红柿煮出酸甜的汤，鸡蛋炒得嫩滑，再加上店里手工做的面。", "story": "在中国，很多人学会做的第一道菜就是西红柿炒鸡蛋。它酸甜、下饭，也是很多在国外的中国人最想念的「妈妈的味道」。", "ing": "手工小麦面（店内制作）、西红柿、鸡蛋、青菜", "taste": "酸甜开胃，汤里带着西红柿的香气，鸡蛋嫩滑。", "who": "素食客人、不吃辣的客人、小朋友。"}, "es": {"what": "El tomate con huevo revuelto es probablemente el plato casero más conocido de China; casi todo el mundo sabe hacerlo. Lo convertimos en sopa: el tomate da un caldo agridulce, el huevo queda suave, y todo va con fideos hechos a mano en el local.", "story": "Para muchos chinos fue el primer plato que aprendieron a cocinar, y es el sabor de mamá que más echan de menos cuando viven fuera.", "ing": "Fideos de trigo hechos a mano en el local, tomate, huevo, verdura", "taste": "Agridulce, con aroma a tomate; huevo tierno.", "who": "Vegetarianos, quien no quiere picante y los niños."}, "en": {"what": "Tomato and scrambled egg is probably China's best-known home dish; nearly everyone can cook it. We turned it into a noodle soup: tomato makes a sweet-and-sour broth, the egg stays soft, all with noodles handmade in-house.", "story": "For many Chinese it was the first dish they learned to cook, and it's the taste of home they miss most when living abroad.", "ing": "Handmade wheat noodles (made in-house), tomato, egg, greens", "taste": "Sweet and sour with a tomato aroma; soft egg.", "who": "Vegetarians, no-spice eaters and kids."}}, "2-9": {"zh": {"what": "一碗清清爽爽的蔬菜汤面，加一个鸡蛋。没有复杂的调味，吃的是面条本身和热汤的舒服。", "story": "在中国，天冷、胃不舒服或者加班到很晚的时候，很多人最想吃的就是这样一碗简单的热汤面。", "ing": "手工小麦面（店内制作）、鸡蛋、青菜；汤底为肉汤", "taste": "清淡温和，面条筋道。", "note": "这道面没有肉块，但汤底是肉汤，不适合素食和纯素客人。", "who": "想吃得清淡、舒服的客人。"}, "es": {"what": "Un cuenco ligero de fideos con verdura y huevo. Sin complicaciones: la gracia está en el fideo y en un caldo caliente.", "story": "En China, cuando hace frío, cuando el estómago pide algo suave o cuando se sale tarde del trabajo, esto es lo que apetece.", "ing": "Fideos de trigo hechos a mano en el local, huevo, verdura. Caldo de carne.", "taste": "Suave y ligero; fideos firmes.", "note": "No lleva trozos de carne, pero el caldo es de carne: no es apto para vegetarianos ni veganos.", "who": "Quien busca algo ligero y reconfortante."}, "en": {"what": "A light bowl of noodles with greens and an egg. Nothing complicated: it's about the noodles and a hot broth.", "story": "In China, when it's cold, when your stomach wants something gentle or when you finish work late, this is the bowl people crave.", "ing": "Handmade wheat noodles (made in-house), egg, greens. Meat-based broth.", "taste": "Mild and light; springy noodles.", "note": "No pieces of meat, but the broth is meat-based: not suitable for vegetarians or vegans.", "who": "Anyone wanting something light and comforting."}}, "2-11": {"zh": {"what": "水煮蛋，可以加在任何一碗面里，让面更扎实。", "ing": "鸡蛋"}, "es": {"what": "Huevo cocido para añadir a cualquier cuenco de fideos.", "ing": "Huevo"}, "en": {"what": "A boiled egg to add to any noodle bowl.", "ing": "Egg"}}, "3-1": {"zh": {"what": "鸡蛋和洋葱、胡萝卜、卷心菜一起炒的面，没有汤。炒面好不好吃，关键在「锅气」：大火快炒时，食材边缘微微焦香的那种味道。", "story": "「锅气」在粤语里叫「镬气」，被很多中国厨师视为炒菜的灵魂。同样的食材，有没有锅气，吃起来完全是两回事。", "ing": "手工小麦面（店内制作）、鸡蛋、洋葱、胡萝卜、卷心菜", "taste": "咸香，带着锅气，蔬菜清甜爽脆。", "who": "素食客人、不吃辣的客人。"}, "es": {"what": "Fideos salteados con huevo, cebolla, zanahoria y repollo, sin caldo. El secreto de un buen salteado es el wok hei, el aliento del wok: ese toque ligeramente tostado que solo da el fuego muy fuerte.", "story": "En cantonés se llama wok hei, y muchos cocineros chinos lo consideran el alma de un salteado. Con los mismos ingredientes, con o sin wok hei son platos distintos.", "ing": "Fideos de trigo hechos a mano en el local, huevo, cebolla, zanahoria, repollo", "taste": "Sabroso, con aroma a wok; verduras dulces y crujientes.", "who": "Vegetarianos y quien no quiere picante."}, "en": {"what": "Noodles stir-fried with egg, onion, carrot and cabbage, no broth. The secret of good fried noodles is wok hei, the breath of the wok: the slightly smoky edge you only get from a very hot fire.", "story": "Cantonese call it wok hei, and many Chinese chefs see it as the soul of stir-frying. With the same ingredients, a dish with and without wok hei tastes completely different.", "ing": "Handmade wheat noodles (made in-house), egg, onion, carrot, cabbage", "taste": "Savoury and smoky; sweet, crunchy vegetables.", "who": "Vegetarians and no-spice eaters."}}, "3-2": {"zh": {"what": "猪肉丝和洋葱、胡萝卜、卷心菜一起大火炒的面。肉丝切得细，和面条一起入口。", "story": "肉丝炒面是中国街边小馆最常见的一道面，也是很多人心中「炒面」两个字的标准样子。", "ing": "手工小麦面（店内制作）、猪肉丝、洋葱、胡萝卜、卷心菜", "taste": "咸香，带着锅气。", "who": "喜欢炒面、不吃辣的客人。"}, "es": {"what": "Fideos salteados a fuego fuerte con tiras finas de cerdo, cebolla, zanahoria y repollo.", "story": "Es el salteado más habitual de los restaurantes de barrio en China; para muchos, la definición misma de fideos salteados.", "ing": "Fideos de trigo hechos a mano en el local, cerdo, cebolla, zanahoria, repollo", "taste": "Sabroso, con aroma a wok.", "who": "Amantes de los salteados que no quieren picante."}, "en": {"what": "Noodles wok-fried over high heat with thin pork strips, onion, carrot and cabbage.", "story": "It's the most common fried noodle dish in China's neighbourhood restaurants; for many, the very definition of fried noodles.", "ing": "Handmade wheat noodles (made in-house), pork, onion, carrot, cabbage", "taste": "Savoury, with wok aroma.", "who": "Fried-noodle fans who don't want spice."}}, "3-3": {"zh": {"what": "鸡丝、香菇和蔬菜一起炒的面。香菇在热锅里炒出香气，会让整盘面都带上菌菇的香味。", "story": "香菇是中国厨房里的「提鲜高手」，很多菜里只要放几片，味道就会立刻丰富起来。", "ing": "手工小麦面（店内制作）、鸡丝、香菇、洋葱、胡萝卜、卷心菜", "taste": "咸香，香菇香气明显，带着锅气。", "who": "不吃辣的客人，喜欢鸡肉的客人。"}, "es": {"what": "Fideos salteados con pollo, setas shiitake y verduras. El shiitake en el wok perfuma todo el plato.", "story": "En la cocina china, el shiitake es el gran potenciador de sabor: unas pocas láminas bastan para enriquecer un plato.", "ing": "Fideos de trigo hechos a mano en el local, pollo, setas shiitake, cebolla, zanahoria, repollo", "taste": "Sabroso, con aroma a shiitake y a wok.", "who": "Quien no quiere picante y los amantes del pollo."}, "en": {"what": "Noodles stir-fried with chicken, shiitake and vegetables. In the hot wok, the shiitake perfumes the whole plate.", "story": "In Chinese kitchens, shiitake is the flavour booster: a few slices make any dish richer.", "ing": "Handmade wheat noodles (made in-house), chicken, shiitake, onion, carrot, cabbage", "taste": "Savoury, with shiitake and wok aroma.", "who": "No-spice eaters and chicken lovers."}}, "3-4": {"zh": {"what": "香辣口味的猪肉丝炒面，加红椒和香菜。香菜的清香和辣椒的热辣在大火里碰撞，香味很冲。", "story": "香菜在中国是一种「爱的人超爱、恨的人超恨」的香料。这盘面属于爱它的人。", "ing": "手工小麦面（店内制作）、猪肉丝、香菜、红椒", "taste": "香辣开胃，香菜的清香很突出。", "note": "这是一道辣菜，香菜是这道菜的一部分。", "who": "爱吃辣、喜欢香菜的客人。"}, "es": {"what": "Fideos salteados con cerdo picante, pimiento rojo y cilantro. El frescor del cilantro y el calor del chile chocan en el wok y el aroma es intenso.", "story": "En China el cilantro es de o lo amas o lo odias. Este plato es para quien lo ama.", "ing": "Fideos de trigo hechos a mano en el local, cerdo, cilantro, pimiento rojo", "taste": "Picante y aromático; el cilantro destaca.", "note": "Plato picante; el cilantro forma parte de la receta.", "who": "Amantes del picante y del cilantro."}, "en": {"what": "Spicy pork fried noodles with red pepper and coriander. Fresh coriander and chilli heat collide in the wok for a big aroma.", "story": "In China, coriander is love-it-or-hate-it. This plate is for the lovers.", "ing": "Handmade wheat noodles (made in-house), pork, coriander, red pepper", "taste": "Hot and fragrant; the coriander stands out.", "note": "Spicy; coriander is part of the recipe.", "who": "Spice and coriander lovers."}}, "3-5": {"zh": {"what": "麻辣口味的牛肉炒面。牛肉和洋葱、胡萝卜、卷心菜一起大火快炒，再用麻辣调味。", "story": "麻辣不只能做汤，放进炒锅里，花椒和辣椒的香味会被热油激发得更明显。", "ing": "手工小麦面（店内制作）、牛肉、洋葱、胡萝卜、卷心菜", "taste": "麻辣过瘾，花椒的麻感明显，带着锅气。", "note": "这是一道辣菜。", "who": "爱吃麻辣、喜欢牛肉的客人。"}, "es": {"what": "Fideos salteados con ternera, cebolla, zanahoria y repollo, con sabor mala (chile y pimienta de Sichuan).", "story": "El mala no es solo para sopas: en el wok, el aceite caliente despierta todavía más el aroma del chile y de la pimienta de Sichuan.", "ing": "Fideos de trigo hechos a mano en el local, ternera, cebolla, zanahoria, repollo", "taste": "Picante con hormigueo y aroma a wok.", "note": "Plato picante.", "who": "Amantes del mala y de la ternera."}, "en": {"what": "Beef fried noodles with onion, carrot and cabbage, seasoned mala (chilli and Sichuan pepper).", "story": "Mala isn't only for soups: in the wok, hot oil brings out even more of the chilli and Sichuan pepper aroma.", "ing": "Handmade wheat noodles (made in-house), beef, onion, carrot, cabbage", "taste": "Hot and tingly, with wok aroma.", "note": "Spicy dish.", "who": "Mala and beef lovers."}}, "4-1": {"zh": {"what": "炒方便面：把方便面煮好再下锅炒，是中国街头小摊和学生宿舍里的经典吃法。这一款用西红柿和鸡蛋来炒。方便面细而卷，炒过之后更有弹性。", "story": "方便面在中国几乎是每个人的童年回忆。把它从「泡着吃」变成「炒着吃」，是中国人对方便面最有创意的改造之一。", "ing": "方便面、西红柿、鸡蛋", "taste": "酸甜，面条细而卷，口感有弹性。", "who": "素食客人（含鸡蛋）、想尝点特别吃法的客人。"}, "es": {"what": "Fideos instantáneos cocidos y después salteados al wok: un clásico de los puestos callejeros y de las residencias de estudiantes en China. Esta versión lleva tomate y huevo. El fideo es fino y ondulado, y salteado queda elástico.", "story": "En China, los fideos instantáneos son un recuerdo de infancia para casi todos. Pasar de tomarlos en remojo a saltearlos es uno de los trucos más ingeniosos de la cocina popular.", "ing": "Fideos instantáneos, tomate, huevo", "taste": "Agridulce; fideo fino, ondulado y elástico.", "who": "Vegetarianos (lleva huevo) y curiosos."}, "en": {"what": "Instant noodles boiled, then wok-fried: a classic of Chinese street stalls and student dorms. This one is with tomato and egg. The noodles are thin and curly, and turn springy when fried.", "story": "Instant noodles are a childhood memory for almost everyone in China. Frying them instead of soaking them is one of the cleverest tricks of everyday Chinese cooking.", "ing": "Instant noodles, tomato, egg", "taste": "Sweet and sour; thin, curly, springy noodles.", "who": "Vegetarians (contains egg) and the curious."}}, "4-2": {"zh": {"what": "香辣猪肉丝炒方便面，加红椒和香菜。细卷的方便面特别容易挂住酱汁，每一口都带着香辣味。", "story": "在中国的夜市和大学门口，一盘现炒的方便面是很多人深夜的快乐。", "ing": "方便面、猪肉丝、香菜、红椒", "taste": "香辣开胃，面条细而卷。", "note": "这是一道辣菜。", "who": "爱吃辣、想尝试中国街头小吃的客人。"}, "es": {"what": "Fideos instantáneos salteados con cerdo picante, pimiento rojo y cilantro. El fideo fino y rizado atrapa la salsa en cada bocado.", "story": "En los mercados nocturnos y a la puerta de las universidades chinas, un plato de fideos instantáneos recién salteados es la felicidad de madrugada.", "ing": "Fideos instantáneos, cerdo, cilantro, pimiento rojo", "taste": "Picante y aromático; fideo fino y rizado.", "note": "Plato picante.", "who": "Amantes del picante y de la comida callejera china."}, "en": {"what": "Instant noodles wok-fried with spicy pork, red pepper and coriander. The thin, curly noodles grab the sauce in every bite.", "story": "At night markets and university gates in China, a plate of freshly fried instant noodles is late-night happiness.", "ing": "Instant noodles, pork, coriander, red pepper", "taste": "Hot and fragrant; thin, curly noodles.", "note": "Spicy dish.", "who": "Spice lovers and Chinese street-food fans."}}, "4-3": {"zh": {"what": "孜然肉片炒方便面。孜然是中国西北菜和街头烤串里最常见的香料，香味浓烈，带着烟火气。", "story": "在中国，闻到孜然的香味，很多人想到的就是夜市里的烤串摊。我们把这股夜市的味道炒进了面里。", "ing": "方便面、猪肉片、孜然、洋葱、胡萝卜、卷心菜", "taste": "孜然香气浓郁，带着烤肉一样的焦香。", "who": "喜欢香料味、想尝试新口味的客人。"}, "es": {"what": "Fideos instantáneos salteados con cerdo al comino. El comino es la especia de la cocina del noroeste de China y de los pinchos callejeros: intensa y con aroma a brasa.", "story": "En China, el olor a comino recuerda a los puestos de pinchos de los mercados nocturnos. Metimos ese sabor en los fideos.", "ing": "Fideos instantáneos, cerdo, comino, cebolla, zanahoria, repollo", "taste": "Mucho aroma a comino, con un toque tostado como de barbacoa.", "who": "Amantes de las especias y de probar cosas nuevas."}, "en": {"what": "Instant noodles wok-fried with cumin pork. Cumin is the spice of northwest Chinese cooking and street skewers: bold and smoky.", "story": "In China, the smell of cumin means night-market skewer stalls. We fried that taste into the noodles.", "ing": "Instant noodles, pork, cumin, onion, carrot, cabbage", "taste": "Strong cumin aroma, toasty like barbecue.", "who": "Spice lovers and adventurous eaters."}}, "4-4": {"zh": {"what": "麻辣牛肉炒方便面。牛肉和蔬菜一起大火快炒，用麻辣调味，细卷的面条把麻辣酱汁都裹在身上。", "story": "麻辣加方便面，是很多中国年轻人深夜最想念的组合之一。", "ing": "方便面、牛肉、洋葱、胡萝卜、卷心菜", "taste": "麻辣过瘾，面条细而卷。", "note": "这是一道辣菜。", "who": "爱吃麻辣的客人。"}, "es": {"what": "Fideos instantáneos salteados con ternera y verduras, con sabor mala; el fideo rizado se impregna de salsa.", "story": "Mala y fideos instantáneos: una de las combinaciones nocturnas favoritas de los jóvenes chinos.", "ing": "Fideos instantáneos, ternera, cebolla, zanahoria, repollo", "taste": "Picante con hormigueo; fideo fino y rizado.", "note": "Plato picante.", "who": "Amantes del mala."}, "en": {"what": "Instant noodles wok-fried with beef and vegetables, seasoned mala; the curly noodles soak up the sauce.", "story": "Mala plus instant noodles is a favourite late-night combo for young people in China.", "ing": "Instant noodles, beef, onion, carrot, cabbage", "taste": "Hot and tingly; thin, curly noodles.", "note": "Spicy dish.", "who": "Mala lovers."}}, "5-1": {"zh": {"what": "拌面：店里手工做的面不加汤，拌上酱汁和配料。这一款配鸡丝、香菇和鸡蛋，加了蒜，咸鲜里带着蒜香。", "story": "在中国北方，很多人觉得面条「拌着吃」比「泡在汤里」更能吃出面本身的筋道，因为没有汤，面的口感一点不会被泡软。", "ing": "手工小麦面（店内制作）、鸡丝、香菇、鸡蛋、青菜、蒜", "taste": "咸鲜酱香，带着蒜香，面条筋道。", "how": "上桌后从碗底往上充分拌匀，让每根面都裹上酱汁。", "who": "想吃面又不想喝汤的客人。"}, "es": {"what": "Fideos sin caldo: los fideos hechos a mano en el local llevan salsa y toppings y se mezclan en el cuenco. Este lleva pollo, setas shiitake, huevo y ajo.", "story": "En el norte de China mucha gente prefiere los fideos mezclados a los de sopa: sin caldo, el fideo conserva toda su textura.", "ing": "Fideos de trigo hechos a mano en el local, pollo, setas shiitake, huevo, verdura, ajo", "taste": "Sabroso, con aroma a ajo; fideos firmes.", "how": "Remueve bien desde el fondo para que todos los fideos se impregnen de salsa.", "who": "Quien quiere fideos pero sin sopa."}, "en": {"what": "Dry noodles: our handmade noodles with sauce and toppings, mixed in the bowl. This one has chicken, shiitake, egg and garlic.", "story": "In northern China many prefer mixed noodles to soup: without broth, the noodles keep all their bite.", "ing": "Handmade wheat noodles (made in-house), chicken, shiitake, egg, greens, garlic", "taste": "Savoury and garlicky; springy noodles.", "how": "Mix well from the bottom so every noodle is coated.", "who": "Noodle lovers who don't want soup."}}, "5-2": {"zh": {"what": "香辣猪肉丝拌面，加红椒和蒜。没有汤，酱汁直接裹在面上，味道比汤面更浓、更直接。", "story": "拌面的酱汁不会被汤冲淡，所以香辣味在每一口里都特别集中。", "ing": "手工小麦面（店内制作）、猪肉丝、红椒、青菜、蒜", "taste": "香辣，带着蒜香。", "how": "上桌后充分拌匀再吃。", "note": "这是一道辣菜。", "who": "爱吃辣、喜欢浓郁口味的客人。"}, "es": {"what": "Fideos sin caldo con cerdo picante, pimiento rojo y ajo. La salsa envuelve directamente el fideo: más intenso que en sopa.", "story": "Sin caldo que lo diluya, el picante se concentra en cada bocado.", "ing": "Fideos de trigo hechos a mano en el local, cerdo, pimiento rojo, verdura, ajo", "taste": "Picante y con aroma a ajo.", "how": "Mézclalo bien antes de comer.", "note": "Plato picante.", "who": "Amantes del picante y de los sabores intensos."}, "en": {"what": "Dry noodles with spicy pork, red pepper and garlic. The sauce coats the noodles directly: bolder than a soup.", "story": "With no broth to dilute it, the heat is concentrated in every bite.", "ing": "Handmade wheat noodles (made in-house), pork, red pepper, greens, garlic", "taste": "Hot and garlicky.", "how": "Mix well before eating.", "note": "Spicy dish.", "who": "Spice lovers who like bold flavours."}}, "5-3": {"zh": {"what": "老坛酸菜牛肉拌面，和 2-5 一样的酸菜牛肉，只是不加汤，加了蒜。酸菜的酸、牛肉的香和蒜的辛，全都直接裹在面上。", "story": "同一份酸菜牛肉，做汤面和做拌面是两种体验：汤面酸在汤里，拌面酸在每一根面上。", "ing": "手工小麦面（店内制作）、牛肉、酸菜、青菜、蒜", "taste": "酸爽开胃，牛肉软烂，蒜香明显。", "how": "上桌后充分拌匀再吃。", "who": "喜欢酸口、想吃拌面的客人。"}, "es": {"what": "La misma ternera con mostaza encurtida del 2-5, pero sin caldo y con ajo. Lo ácido, la ternera y el ajo envuelven el fideo.", "story": "Mismos ingredientes, dos experiencias: en sopa, lo ácido está en el caldo; sin caldo, está en cada fideo.", "ing": "Fideos de trigo hechos a mano en el local, ternera, mostaza china encurtida, verdura, ajo", "taste": "Ácido y refrescante; ternera tierna, aroma a ajo.", "how": "Mézclalo bien antes de comer.", "who": "Amantes de lo ácido que prefieren sin caldo."}, "en": {"what": "The same beef and pickled greens as 2-5, but without broth and with garlic. Sour, meaty and garlicky, all coating the noodles.", "story": "Same toppings, two experiences: in soup the sourness is in the broth; dry, it's on every noodle.", "ing": "Handmade wheat noodles (made in-house), beef, pickled mustard greens, leafy greens, garlic", "taste": "Tangy and refreshing; tender beef, garlicky.", "how": "Mix well before eating.", "who": "Sour-flavour fans who prefer no broth."}}, "5-4": {"zh": {"what": "炸酱面是老北京的经典面食。传统做法用肉末和黄酱，本店做的是鸡蛋炸酱：鸡蛋和酱一起在店里现炒，不含肉。", "story": "在北京，一碗炸酱面就是胡同里的家常味道。我们把肉末换成了鸡蛋，让不吃肉的朋友也能尝到这一口地道的酱香。", "ing": "手工小麦面（店内制作）、鸡蛋炸酱、黄瓜丝", "taste": "酱香浓、偏咸香，配上清脆的黄瓜丝，一口浓郁一口清爽。", "how": "这是拌面，没有汤。上桌后把酱、黄瓜和面充分拌匀再吃。", "who": "素食客人（含鸡蛋，不适合纯素）、想吃面又不想喝汤的人。"}, "es": {"what": "El zhajiangmian es un clásico de Pekín. La receta tradicional lleva carne picada y pasta de soja fermentada; la nuestra es de huevo: salteamos el huevo con la pasta de soja en el local, sin carne.", "story": "En Pekín, un cuenco de zhajiangmian sabe a los hutong, los callejones de toda la vida. Cambiamos la carne por huevo para que quien no come carne también pueda probarlo.", "ing": "Fideos de trigo hechos a mano en el local, pasta de soja fermentada salteada con huevo, pepino en tiras", "taste": "Salsa intensa y salada con el frescor crujiente del pepino.", "how": "No lleva caldo: mezcla bien la salsa, el pepino y los fideos antes de comer.", "who": "Vegetarianos (lleva huevo, no es vegano) y quien quiere fideos sin sopa."}, "en": {"what": "Zhajiang noodles are a Beijing classic. The traditional version uses minced meat and fermented bean paste; ours uses egg, stir-fried in-house with the bean paste, no meat.", "story": "In Beijing, a bowl of zhajiang noodles tastes of the hutong, the old alleyways. We swapped the meat for egg so non-meat eaters can enjoy it too.", "ing": "Handmade wheat noodles (made in-house), fermented bean sauce with egg, cucumber strips", "taste": "Rich, salty sauce balanced by crisp cucumber.", "how": "No broth: mix the sauce, cucumber and noodles well before eating.", "who": "Vegetarians (contains egg, not vegan) and anyone wanting noodles without soup."}}, "5-5": {"zh": {"what": "油泼面是陕西的经典面食：把辣椒面、蒜等铺在面上，再浇上一勺滚烫的热油。热油把辣椒和蒜的香味一下子激发出来。", "story": "热油浇下去的那一刻会发出「刺啦」一声，香气一下子就冒出来，这是油泼面最有名的瞬间。", "ing": "手工小麦面（店内制作）、辣椒、青菜、蒜", "taste": "香大于辣，热油激出辣椒和蒜的香味。", "how": "上桌后充分拌匀，让每根面都裹上红油。", "who": "纯素客人、喜欢香辣口味的客人。"}, "es": {"what": "El youpo mian es un clásico de Shaanxi: se pone chile en polvo y ajo sobre los fideos y se vierte encima un cucharón de aceite hirviendo, que despierta de golpe el aroma del chile y del ajo.", "story": "Cuando el aceite cae suena un chisporroteo y sube todo el aroma: es el momento más famoso de este plato.", "ing": "Fideos de trigo hechos a mano en el local, chile, verdura, ajo", "taste": "Más aromático que picante.", "how": "Mézclalo bien para que todos los fideos se impregnen del aceite rojo.", "who": "Veganos y amantes del picante aromático."}, "en": {"what": "Youpo noodles are a Shaanxi classic: chilli flakes and garlic go on the noodles, then a ladle of sizzling oil is poured over, releasing their aroma all at once.", "story": "When the hot oil hits there's a loud sizzle and the aroma rises: the most famous moment of this dish.", "ing": "Handmade wheat noodles (made in-house), chilli, greens, garlic", "taste": "More fragrant than fiery.", "how": "Mix well so every noodle is coated in the red oil.", "who": "Vegans and fans of fragrant heat."}}, "6-1": {"zh": {"what": "五香牛肉是中国常见的凉菜：牛肉用五香料卤制，放凉后切片。「五香」通常指八角、桂皮、花椒、丁香、小茴香这类香料。店内自制。", "story": "在中国，五香牛肉是家宴和小酒馆里的常客，配一瓶冰啤酒，就是完美的下酒小菜。", "ing": "牛肉", "taste": "咸香，带着浓浓的香料味，肉质紧实有嚼劲。", "who": "想加一道下酒菜或分享小菜的客人，配一瓶冰啤酒正好。"}, "es": {"what": "Ternera a las cinco especias, un entrante frío muy típico en China: la ternera se cuece en un caldo especiado, se deja enfriar y se corta en lonchas. Las cinco especias suelen ser anís estrellado, canela, pimienta de Sichuan, clavo e hinojo. Hecha en el local.", "story": "En China es un fijo de las comidas familiares y de las tabernas: con una bebida, el picoteo perfecto.", "ing": "Ternera", "taste": "Sabrosa y especiada; carne firme.", "who": "Para compartir o para acompañar una cerveza fría."}, "en": {"what": "Five-spice beef, a classic Chinese cold starter: beef is simmered in a spiced broth, cooled and sliced. The five spices are usually star anise, cinnamon, Sichuan pepper, clove and fennel. Made in-house.", "story": "In China it's a regular at family dinners and small taverns: with a drink, the perfect snack.", "ing": "Beef", "taste": "Savoury and spiced; firm, chewy meat.", "who": "Sharing, or with a cold beer."}}, "6-2": {"zh": {"what": "凉拌黄瓜，中国餐桌上最常见的开胃凉菜之一。店内现拌。", "story": "中国人吃热面、吃重口味的菜时，总爱配一碟凉拌黄瓜，一热一凉，一浓一清，这就是中国餐桌上的平衡感。", "ing": "黄瓜，用蒜、酱油和芝麻调味", "taste": "清爽开胃，口感脆嫩。", "who": "配一碗热面或黄焖锅，解腻正好。"}, "es": {"what": "Pepino aliñado, uno de los entrantes fríos más comunes en la mesa china. Preparada al momento en el local.", "story": "Con un plato caliente o intenso, en China siempre se pide un pepino frío: calor y frescor, intenso y ligero. Ese es el equilibrio de la mesa china.", "ing": "Pepino aliñado con ajo, soja y sésamo", "taste": "Fresco y crujiente.", "who": "Para acompañar unos fideos calientes o una olla."}, "en": {"what": "Cucumber salad, one of the most common cold starters on a Chinese table. Made to order in-house.", "story": "With hot or bold dishes, Chinese diners always order cold cucumber: hot and cold, rich and light. That's the balance of a Chinese meal.", "ing": "Cucumber dressed with garlic, soy sauce and sesame", "taste": "Fresh and crunchy.", "who": "Alongside hot noodles or a clay pot."}}, "6-4": {"zh": {"what": "凉拌海藻，清爽的小凉菜，上菜很快。", "ing": "海藻", "taste": "清爽，口感脆嫩，带一点芝麻香。", "who": "想加一道清爽小菜的客人。"}, "es": {"what": "Ensalada de alga wakame, un entrante frío y ligero que sale enseguida.", "ing": "Alga wakame", "taste": "Fresca y crujiente, con un toque de sésamo.", "who": "Quien quiere un entrante ligero."}, "en": {"what": "Wakame seaweed salad, a light cold starter that comes out quickly.", "ing": "Wakame", "taste": "Fresh and crunchy, with a touch of sesame.", "who": "Anyone wanting a light side."}}, "6-5": {"zh": {"what": "辣白菜，发酵的辣味白菜，店里自己腌制。有小份和大份。", "story": "辣白菜在中国东北也很常见，那里的朝鲜族家庭世代都有腌白菜的传统。一碟辣白菜，酸辣开胃，几乎配什么都好吃。", "ing": "白菜、辣椒、鱼露", "taste": "酸辣开胃，脆爽。", "note": "含鱼露，不适合素食和纯素客人。", "who": "配面或配饭都合适，第一次可以先点一份小的尝尝。"}, "es": {"what": "Kimchi: col china fermentada y picante, preparada en el local. Ración pequeña o grande.", "story": "El kimchi también es muy común en el noreste de China, donde las familias de origen coreano lo preparan desde hace generaciones. Ácido y picante, combina con casi todo.", "ing": "Col china, chile, salsa de pescado", "taste": "Ácido, picante y crujiente.", "note": "Lleva salsa de pescado: no es apto para vegetarianos ni veganos.", "who": "Con fideos o arroz; la primera vez, prueba la ración pequeña."}, "en": {"what": "Kimchi: spicy fermented napa cabbage, made in-house. Small or large.", "story": "Kimchi is also common in northeast China, where Korean-Chinese families have made it for generations. Sour and spicy, it goes with almost anything.", "ing": "Napa cabbage, chilli, fish sauce", "taste": "Sour, spicy and crunchy.", "note": "Contains fish sauce: not suitable for vegetarians or vegans.", "who": "With noodles or rice; the first time, try the small one."}}, "7-1": {"zh": {"what": "酱油炒饭：米饭、鸡蛋和洋葱，用酱油大火翻炒。简单的食材，靠的是火候和锅气。", "story": "在中国，酱油炒饭是最考验厨师基本功的一道饭：米饭要粒粒分明，每一粒都均匀裹上酱色。", "ing": "米饭、酱油、鸡蛋、洋葱", "taste": "酱香，粒粒分明，带着锅气。", "who": "素食客人（含鸡蛋）、不吃辣的客人。"}, "es": {"what": "Arroz frito con salsa de soja: arroz, huevo y cebolla salteados a fuego fuerte. Ingredientes sencillos; el secreto es el fuego y el wok.", "story": "En China, este arroz es la prueba de fuego de un cocinero: cada grano suelto y bien teñido de soja.", "ing": "Arroz, salsa de soja, huevo, cebolla", "taste": "Sabor a soja, grano suelto y aroma a wok.", "who": "Vegetarianos (lleva huevo) y quien no quiere picante."}, "en": {"what": "Soy sauce fried rice: rice, egg and onion tossed over high heat. Simple ingredients; the secret is the fire and the wok.", "story": "In China this rice is the test of a cook's basics: every grain separate and evenly coated in soy.", "ing": "Rice, soy sauce, egg, onion", "taste": "Soy flavour, separate grains, wok aroma.", "who": "Vegetarians (contains egg) and no-spice eaters."}}};

    }
    h+=`</div>`;
    if(s.id==="hm")h+=`<div class="extras"><b>${t.extras}</b><ul>${EXTRAS.map(e=>`<li><span>${esc(nm(e[0]))}</span><span>+${eur(e[1],L)}</span></li>`).join("")}</ul></div>`;
    h+=`</section>`;
  }
  h+=`<section id="bebidas"><div class="sh"><h3>${t.drinks}</h3>${L==="zh"?"":'<span class="zh">酒水</span>'}</div><div class="drinks">`;
  for(const k of ["beers","wine","soft","water"])h+=`<div><h5>${t[k]}</h5><ul>${DR[k].map(x=>`<li><span>${esc(typeof x[0]==="string"?x[0]:nm(x[0]))}</span><span>${eur(x[1],L)}</span></li>`).join("")}</ul></div>`;
  h+=`</div></section>`;
  $("menu").innerHTML=h;
  spy();
}
function openDet(c){
  const d=findDish(c);if(!d||!DET[c])return;const t=T[L],lb=LBL[L],x=DET[c][L];
  const rows=["what","story","ing","taste","adj","how","note","who"].filter(k=>x[k]).map(k=>{
    const v=k==="adj"?t.adj:(k==="how"&&x.how==="POT"?t.pot:x[k]);return `<div><dt>${lb[k]}</dt><dd>${esc(v)}</dd></div>`}).join("");
  const price=d.p2?`${eur(d.p,L)} / ${eur(d.p2,L)}`:eur(d.p,L);
  const sh=$("sheet");
  sh.innerHTML=`<button class="close" id="close" aria-label="${t.close}">×</button>${d.img?`<img src="img/${d.img}.jpg" alt="">`:`<div class="ph">${illo(d.c,t.illo)}</div>`}
   <div class="in"><h3>${esc(L==="zh"?d.zh:d[L])}</h3><div class="meta"><span>${d.c} · ${esc(L==="zh"?d.es:d.zh)}</span><b>${price}</b></div>
   <div class="algbox"><dt>${lb.alg}</dt>${algRow(d.al)}</div>
   <dl>${rows}</dl>${pairBox(d)}</div>`;
  sh.hidden=false;$("scrim").hidden=false;document.body.style.overflow="hidden";$("close").focus();
  $("close").onclick=closeDet;
}
function closeDet(){$("sheet").hidden=true;$("scrim").hidden=true;document.body.style.overflow=""}
document.addEventListener("click",e=>{const r=e.target.closest("[data-det]");if(r)openDet(r.dataset.det);else if(e.target.id==="scrim")closeDet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDet();const r=e.target.closest&&e.target.closest("[data-det]");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openDet(r.dataset.det)}});
function setLang(l){L=l;try{localStorage.setItem("lang",l)}catch(e){}render()}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
$("copy").addEventListener("click",e=>{
  const b=e.currentTarget;const sel=()=>getSelection().selectAllChildren($("phone"));
  const done=()=>{b.textContent=T[L].copied;setTimeout(()=>b.textContent=T[L].copy,1500)};
  try{navigator.clipboard.writeText("+34671343226").then(done,sel)}catch(_){sel()}
});
let obs;
function spy(){
  if(obs)obs.disconnect();
  if(!("IntersectionObserver" in window))return;
  obs=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){document.querySelectorAll(".rail a").forEach(a=>{const on=a.dataset.s===en.target.id;a.classList.toggle("on",on);if(on){a.parentNode.scrollLeft=a.offsetLeft-16}})}})},{rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll("main section").forEach(s=>obs.observe(s));
}
(function(){let l=null;try{l=localStorage.getItem("lang")}catch(e){}
 if(!l){const n=(navigator.language||"es").slice(0,2);l=n==="zh"?"zh":(n==="es"||n==="ca")?"es":"en"}
 L=T[l]?l:"es";render()})();
</script>
